  <title>제조공정 개선 검토 랜딩페이지</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_placeholder">Loading 제조공정 개선 검토 랜딩페이지...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"ko\"><head>\n<meta charset=\"utf-8\">\n<title>제조공정 개선 검토 랜딩페이지<\u002Ftitle>\n<script src=\"58b225ed-c148-4112-9185-8cb5e7f583d9\"><\u002Fscript>\n<meta name=\"hz:slide-selector\" content=\":not(x-dc)&gt;[data-canvas-width]\"><meta name=\"hz:canvas-width\" content=\"1440\"><meta name=\"hz:canvas-height\" content=\"6200\"><\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap\">\n<style>\nbody{margin:0}\nhtml{scroll-behavior:smooth}\n.lp{font-family:'Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--teal);background:var(--ivory);-webkit-font-smoothing:antialiased}\n.lp *{box-sizing:border-box}\n.lp [id]{scroll-margin-top:72px}\n.lp a{text-decoration:none;color:inherit}\n.lp h1,.lp h2,.lp h3,.lp p{margin:0}\n.wrap{max-width:1200px;margin:0 auto;padding-left:24px;padding-right:24px}\n.sec{padding-top:112px;padding-bottom:112px}\n.h2{font-size:clamp(26px,3vw,38px);line-height:1.3;font-weight:900;letter-spacing:-0.02em;text-wrap:balance}\n.lead{font-size:18px;line-height:1.75;text-wrap:pretty}\n\n/* 버튼 */\n.btn{display:inline-flex;align-items:center;gap:12px;min-height:56px;padding:0 28px;border-radius:999px;font-weight:700;font-size:18px;line-height:1.2;border:0;cursor:pointer;font-family:inherit;transition:background-color 300ms ease,box-shadow 300ms ease,transform 300ms ease}\n.btn svg{transition:transform 300ms ease}\n.btn:hover svg{transform:translateX(4px)}\n.btn:focus-visible,.lp button:focus-visible,.lp a:focus-visible{outline:3px solid var(--coral) !important;outline-offset:3px}\n.btn-coral{background:var(--coral);color:var(--tealDark)}\n.btn-coral:hover{background:#E4A08E;box-shadow:0 10px 28px rgba(0,0,0,.22)}\n.btn-teal{background:var(--teal);color:var(--ivory)}\n.btn-teal:hover{background:#1B343E;box-shadow:0 10px 28px rgba(38,70,83,.28)}\n\n/* 카드 */\n.card{transition:transform 350ms cubic-bezier(.2,.7,.2,1),box-shadow 350ms ease,border-color 350ms ease}\n.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(20,40,48,.16)}\n.card-ivory:hover{border-color:var(--coral)}\n\n/* 내비게이션 */\n.nav-links{display:flex;gap:28px}\n.nav-links a{font-size:15px;font-weight:500;opacity:.85;transition:opacity 250ms ease,color 250ms ease}\n.nav-links a:hover{opacity:1;color:var(--coral)}\n\n/* 히어로 */\n.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);grid-template-areas:\"text img\" \"cta img\";grid-template-rows:auto 1fr;column-gap:64px;align-items:start}\n.hero-text{grid-area:text}\n.hero-cta{grid-area:cta}\n.hero-img{grid-area:img}\n\n/* 흐름 화살표 */\n.flow-arrow{position:absolute;right:-22px;top:50%;margin-top:-14px;width:28px;height:28px;z-index:2}\n.fill-line{position:absolute;left:12.5%;right:12.5%;top:27px;height:2px;background:rgba(38,70,83,.25)}\n\n.mbar{display:none}\n\n@media (max-width:900px){\n  .hero-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:\"text\" \"img\" \"cta\";row-gap:32px}\n  .flow-arrow{display:none}\n  .fill-line{display:none}\n}\n@media (max-width:720px){\n  .sec{padding-top:72px;padding-bottom:72px}\n  .wrap{padding-left:20px;padding-right:20px}\n  .nav-links{display:none}\n  .lead{font-size:16px}\n  .btn{font-size:17px;padding:0 22px}\n  .mbar{display:block;position:sticky;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#1B343E;border-top:1px solid rgba(245,241,232,.18);opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity 350ms ease,transform 350ms ease,visibility 0s linear 350ms}\n  .mbar.show{opacity:1;visibility:visible;transform:none;transition-delay:0s}\n  .mbar .btn{width:100%;justify-content:center}\n}\n\n/* 애니메이션 */\n/* 히어로: 로드 시 순차 실행 (제목 0.2s · 설명 0.5s · CTA 0.8s · 이미지 0.3~1.1s) */\n@keyframes heroUp{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}\n@keyframes heroFade{from{opacity:0}to{opacity:1}}\n@keyframes heroImg{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}\n.a1{animation:heroUp 800ms cubic-bezier(.2,.7,.2,1) 200ms both}\n.a2{animation:heroFade 800ms ease 500ms both}\n.a3{animation:heroFade 700ms ease 800ms both}\n.a4{animation:heroImg 800ms cubic-bezier(.2,.7,.2,1) 300ms both}\n\n/* 스크롤 등장: JS(IntersectionObserver)가 .in 을 붙이면 실행. JS가 없으면 .js-on 이 없어 그대로 보임 */\n@keyframes rvIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}\n@keyframes imgRv{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}\n.js-on .rv,.js-on .rv .stg,.js-on .rv .rimg,.js-on .rv .arr{opacity:0}\n.js-on .rv.in{opacity:1;animation:rvIn 750ms cubic-bezier(.2,.7,.2,1) var(--d,0ms) backwards}\n.js-on .rv.in .stg{opacity:1;animation:rvIn 750ms cubic-bezier(.2,.7,.2,1) calc(var(--d,0ms) + 180ms) backwards}\n.js-on .rv.in .rimg{opacity:1;animation:imgRv 900ms cubic-bezier(.2,.7,.2,1) var(--d,0ms) backwards}\n.js-on .rv.in .arr{opacity:1;transition:opacity 500ms ease calc(var(--d,0ms) + 500ms)}\n.rvg>.rv:nth-child(2){--d:120ms}\n.rvg>.rv:nth-child(3){--d:240ms}\n.rvg>.rv:nth-child(4){--d:360ms}\n.js-on .rvl .fill-line{transform:scaleX(0);transform-origin:left center}\n.js-on .rvl.in .fill-line{transform:scaleX(1);transition:transform 1200ms cubic-bezier(.4,0,.2,1) 150ms}\n\n/* 연구 사례 카드 hover: 5px 상승 · 그림자 · 내부 이미지 1.03배 · 300ms */\n.proofcard{transition:transform 300ms ease,box-shadow 300ms ease}\n.proofcard:hover{transform:translateY(-5px);box-shadow:0 22px 48px rgba(0,0,0,.3)}\n.proofcard .pv{transition:transform 300ms ease}\n.proofcard:hover .pv{transform:scale(1.03)}\n\n/* FAQ 300ms */\n.faq-body{transition:grid-template-rows 300ms cubic-bezier(.4,0,.2,1)}\n.faq-chev{transition:transform 300ms cubic-bezier(.4,0,.2,1)}\n\n/* 모션 줄이기 설정: 이동·확대는 끄고 부드러운 페이드만 유지 */\n@media (prefers-reduced-motion:reduce){\n  html{scroll-behavior:auto}\n  @keyframes heroUp{from{opacity:0}to{opacity:1}}\n  @keyframes heroImg{from{opacity:0}to{opacity:1}}\n  @keyframes rvIn{from{opacity:0}to{opacity:1}}\n  @keyframes imgRv{from{opacity:0}to{opacity:1}}\n  .card:hover,.proofcard:hover,.proofcard:hover .pv,.btn:hover svg{transform:none}\n  .js-on .rvl .fill-line{transform:none}\n  .faq-body,.faq-chev{transition:none}\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div class=\"lp\" ref=\"{{rootRef}}\" style=\"--teal:{{teal}};--tealDark:#1B343E;--ivory:{{ivory}};--coral:{{coral}};--coralDeep:#A9482F;--paper:#FBF9F4;--line:#DDD5C2;--muted:#4A5F66\" data-canvas-width=\"1440\" data-canvas-height=\"6200\">\n\n<!-- NAV -->\n<header style=\"position:sticky;top:0;z-index:20;background:var(--teal);color:var(--ivory);border-bottom:1px solid rgba(245,241,232,.14)\">\n<div class=\"wrap\" style=\"display:flex;align-items:center;justify-content:space-between;gap:24px;height:64px\">\n<a href=\"#top\" style=\"font-weight:900;font-size:18px;letter-spacing:-0.01em\">[브랜드명 미정]<\u002Fa>\n<nav class=\"nav-links\" aria-label=\"페이지 내 이동\">\n<a href=\"#pain\">고민<\u002Fa>\n<a href=\"#why\">확인 순서<\u002Fa>\n<a href=\"#how\">검토 방법<\u002Fa>\n<a href=\"#proof\">연구 사례<\u002Fa>\n<a href=\"#criteria\">검토 기준<\u002Fa>\n<\u002Fnav>\n<a href=\"{{formHref}}\" target=\"{{formTarget}}\" rel=\"noopener\" class=\"btn btn-coral\" style=\"min-height:44px;padding:0 20px;font-size:15px\">검토 요청<\u002Fa>\n<\u002Fdiv>\n<\u002Fheader>\n\n<!-- 01 HERO -->\n<section id=\"top\" style=\"background:var(--teal);color:var(--ivory);padding:88px 0 96px\">\n<div class=\"wrap\">\n<div class=\"hero-grid\">\n<div class=\"hero-text\">\n<p class=\"a1\" style=\"display:flex;align-items:center;gap:12px;font-size:15px;font-weight:500;letter-spacing:.04em;color:rgba(245,241,232,.82);margin-bottom:28px\"><span style=\"width:28px;height:2px;background:var(--coral);display:block\"><\u002Fspan>중소 제조기업을 위한 AI·데이터 공정 개선 검토<\u002Fp>\n<h1 class=\"a1\" style=\"font-size:clamp(32px,4.2vw,58px);line-height:1.22;font-weight:900;letter-spacing:-0.03em;text-wrap:balance\">우리 공장, 어디부터 <span style=\"color:var(--coral)\">자동화<\u002Fspan>해야 할까요?<\u002Fh1>\n<p class=\"a2\" style=\"font-size:clamp(20px,2vw,26px);font-weight:700;margin-top:28px;line-height:1.4\">품질검사부터 불량 예측까지.<\u002Fp>\n<p class=\"a2 lead\" style=\"margin-top:20px;color:rgba(245,241,232,.88)\">반복되는 검사 업무, 원인을 찾기 어려운 불량, 제대로 활용하지 못한 공정 데이터.<br>실제 AI·데이터 분석 연구 3건을 바탕으로 공정 개선 전에 확인해야 할 기준을 살펴보세요.<\u002Fp>\n<\u002Fdiv>\n<div class=\"hero-cta a3\" style=\"display:flex;flex-direction:column;align-items:flex-start;gap:20px;margin-top:36px\">\n<a href=\"#criteria\" class=\"btn btn-coral\">공정 개선 검토 기준 보기\n<svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<p style=\"font-size:15px;color:rgba(245,241,232,.8)\">실제 연구 3건으로 보는 공정 개선 기준<\u002Fp>\n<\u002Fdiv>\n<div class=\"hero-img a4\">\n<img src=\"c21f8971-f803-4623-933d-5f9d35ea883f\" alt=\"작업 공정을 지켜보며 고민하는 중소 제조기업 대표. 뒤쪽에서 작업자가 비누 제품을 검사하고, 오른쪽 노트북에는 센서 데이터 그래프가 표시되어 있다.\" style=\"display:block;width:100%;aspect-ratio:5/4;object-fit:cover;object-position:30% center;border-radius:20px;box-shadow:0 30px 60px rgba(0,0,0,.28)\">\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- 02 PAIN POINT -->\n<section id=\"pain\" class=\"sec\" style=\"background:var(--ivory)\">\n<div class=\"wrap\">\n<div class=\"rv\" style=\"max-width:760px\">\n<p style=\"font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--coralDeep);margin-bottom:16px\">02 · PAIN POINT<\u002Fp>\n<h2 class=\"h2\">매일 반복되는 공정의 어려움, 익숙한 고민 아닌가요?<\u002Fh2>\n<\u002Fdiv>\n<div class=\"rvg\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:28px;margin-top:56px\">\n<article class=\"card card-ivory rv\" style=\"background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden\">\n<img src=\"660223ff-0306-4a94-90e2-0c4b6caa54b7\" alt=\"마스크와 위생모를 착용한 작업자가 비누 제품을 육안으로 검사하는 모습\" class=\"rimg\" loading=\"lazy\" style=\"display:block;width:100%;aspect-ratio:4/3;object-fit:cover\">\n<div class=\"stg\" style=\"padding:28px\">\n<p style=\"font-size:14px;font-weight:700;color:var(--coralDeep);letter-spacing:.1em\">CARD 01<\u002Fp>\n<h3 style=\"font-size:22px;line-height:1.4;font-weight:700;margin-top:10px;text-wrap:balance\">사람이 하나씩 확인하는 품질검사<\u002Fh3>\n<p style=\"font-size:16px;line-height:1.75;color:var(--muted);margin-top:12px\">작업자의 경험과 판단에 의존하는 검사 방식. 판정의 일관성과 검사 효율을 고민할 수 있습니다.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n<article class=\"card card-ivory rv\" style=\"background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden\">\n<img src=\"d68a9bf0-5810-48a0-98a1-53bf60d8a2fd\" alt=\"컨베이어 위에 줄지어 놓인 비누 제품. 외관 결함과 품질 기록을 확인하는 단계\" class=\"rimg\" loading=\"lazy\" style=\"display:block;width:100%;aspect-ratio:4/3;object-fit:cover\">\n<div class=\"stg\" style=\"padding:28px\">\n<p style=\"font-size:14px;font-weight:700;color:var(--coralDeep);letter-spacing:.1em\">CARD 02<\u002Fp>\n<h3 style=\"font-size:22px;line-height:1.4;font-weight:700;margin-top:10px;text-wrap:balance\">반복되는 불량, 원인은 어디에 있을까요?<\u002Fh3>\n<p style=\"font-size:16px;line-height:1.75;color:var(--muted);margin-top:12px\">불량은 확인했지만 어떤 공정 조건이 문제였는지 파악하기 어려울 수 있습니다.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n<article class=\"card card-ivory rv\" style=\"background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden\">\n<img src=\"baf8b897-a149-4d24-9e8a-95fb03e7d81a\" alt=\"센서 데이터 그래프가 표시된 작업용 노트북 화면\" class=\"rimg\" loading=\"lazy\" style=\"display:block;width:100%;aspect-ratio:4/3;object-fit:cover\">\n<div class=\"stg\" style=\"padding:28px\">\n<p style=\"font-size:14px;font-weight:700;color:var(--coralDeep);letter-spacing:.1em\">CARD 03<\u002Fp>\n<h3 style=\"font-size:22px;line-height:1.4;font-weight:700;margin-top:10px;text-wrap:balance\">쌓이는 데이터, 활용은 어떻게 해야 할까요?<\u002Fh3>\n<p style=\"font-size:16px;line-height:1.75;color:var(--muted);margin-top:12px\">설비 데이터가 있어도 분석 방법이 없다면 공정 개선에 활용하기 어렵습니다.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- 03 WHY -->\n<section id=\"why\" class=\"sec\" style=\"background:var(--teal);color:var(--ivory)\">\n<div class=\"wrap\">\n<div class=\"rv\" style=\"max-width:820px\">\n<p style=\"font-size:14px;font-weight:700;letter-spacing:.12em;color:rgba(245,241,232,.8);margin-bottom:16px\">03 · WHY<\u002Fp>\n<h2 class=\"h2\">자동화보다 먼저, 현재 공정의 문제를 확인해야 합니다.<\u002Fh2>\n<p class=\"lead\" style=\"margin-top:24px;color:rgba(245,241,232,.9)\">AI를 도입하더라도 해결하려는 문제가 명확하지 않으면 개선 효과를 평가하기 어렵습니다.<br>어떤 결함을 찾아야 하는지, 활용할 수 있는 데이터는 무엇인지, 어떤 결과를 원하는지부터 확인해야 합니다.<\u002Fp>\n<\u002Fdiv>\n<ol class=\"rvg\" style=\"list-style:none;margin:56px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:32px\">\n<li class=\"card rv\" style=\"position:relative;background:var(--ivory);color:var(--teal);border-radius:20px;padding:32px 28px\">\n<div style=\"width:56px;height:56px;border-radius:50%;background:var(--teal);color:var(--coral);display:flex;align-items:center;justify-content:center\">\n<svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M20 20l-4-4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<p style=\"font-size:14px;font-weight:700;color:var(--coralDeep);margin-top:24px;letter-spacing:.1em\">01<\u002Fp>\n<h3 style=\"font-size:22px;font-weight:700;margin-top:6px\">문제 정의<\u002Fh3>\n<p style=\"font-size:16px;line-height:1.7;color:var(--muted);margin-top:10px\">어디서 반복되고 있나요?<\u002Fp>\n<svg class=\"flow-arrow arr\" sc-camel-view-box=\"0 0 28 28\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"14\" cy=\"14\" r=\"14\" fill=\"#D98C78\"><\u002Fcircle><path d=\"M9 14h10M15 10l4 4-4 4\" stroke=\"#1B343E\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n<\u002Fli>\n<li class=\"card rv\" style=\"position:relative;background:var(--ivory);color:var(--teal);border-radius:20px;padding:32px 28px\">\n<div style=\"width:56px;height:56px;border-radius:50%;background:var(--teal);color:var(--coral);display:flex;align-items:center;justify-content:center\">\n<svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"5\" y=\"4\" width=\"14\" height=\"17\" rx=\"2\"><\u002Frect><path d=\"M9 4h6v3H9zM9 14l2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<p style=\"font-size:14px;font-weight:700;color:var(--coralDeep);margin-top:24px;letter-spacing:.1em\">02<\u002Fp>\n<h3 style=\"font-size:22px;font-weight:700;margin-top:6px\">검사 기준<\u002Fh3>\n<p style=\"font-size:16px;line-height:1.7;color:var(--muted);margin-top:10px\">무엇을 불량으로 판단하나요?<\u002Fp>\n<svg class=\"flow-arrow arr\" sc-camel-view-box=\"0 0 28 28\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"14\" cy=\"14\" r=\"14\" fill=\"#D98C78\"><\u002Fcircle><path d=\"M9 14h10M15 10l4 4-4 4\" stroke=\"#1B343E\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n<\u002Fli>\n<li class=\"card rv\" style=\"position:relative;background:var(--ivory);color:var(--teal);border-radius:20px;padding:32px 28px\">\n<div style=\"width:56px;height:56px;border-radius:50%;background:var(--teal);color:var(--coral);display:flex;align-items:center;justify-content:center\">\n<svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 20V10M10 20V4M16 20v-7M22 20H2\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<p style=\"font-size:14px;font-weight:700;color:var(--coralDeep);margin-top:24px;letter-spacing:.1em\">03<\u002Fp>\n<h3 style=\"font-size:22px;font-weight:700;margin-top:6px\">데이터 확인<\u002Fh3>\n<p style=\"font-size:16px;line-height:1.7;color:var(--muted);margin-top:10px\">활용할 수 있는 정보가 있나요?<\u002Fp>\n<svg class=\"flow-arrow arr\" sc-camel-view-box=\"0 0 28 28\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"14\" cy=\"14\" r=\"14\" fill=\"#D98C78\"><\u002Fcircle><path d=\"M9 14h10M15 10l4 4-4 4\" stroke=\"#1B343E\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n<\u002Fli>\n<li class=\"card rv\" style=\"position:relative;background:var(--ivory);color:var(--teal);border-radius:20px;padding:32px 28px\">\n<div style=\"width:56px;height:56px;border-radius:50%;background:var(--teal);color:var(--coral);display:flex;align-items:center;justify-content:center\">\n<svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><path d=\"M12 3v3M12 18v3M3 12h3M18 12h3\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<p style=\"font-size:14px;font-weight:700;color:var(--coralDeep);margin-top:24px;letter-spacing:.1em\">04<\u002Fp>\n<h3 style=\"font-size:22px;font-weight:700;margin-top:6px\">효과 기준<\u002Fh3>\n<p style=\"font-size:16px;line-height:1.7;color:var(--muted);margin-top:10px\">어떤 지표로 비교할까요?<\u002Fp>\n<\u002Fli>\n<\u002Fol>\n<p class=\"rv\" style=\"margin-top:40px;font-size:18px;font-weight:700;color:var(--coral)\">기술을 무조건 도입하는 것보다, 지금의 문제를 정확히 이해하는 일이 먼저입니다.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- 04 HOW IT WORKS -->\n<section id=\"how\" class=\"sec\" style=\"background:var(--ivory)\">\n<div class=\"wrap\">\n<div class=\"rv\" style=\"max-width:760px\">\n<p style=\"font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--coralDeep);margin-bottom:16px\">04 · HOW IT WORKS<\u002Fp>\n<h2 class=\"h2\">AI와 데이터로 공정 개선 가능성을 검토합니다.<\u002Fh2>\n<\u002Fdiv>\n<div class=\"rvl\" style=\"position:relative;margin-top:56px\">\n<div class=\"fill-line\"><\u002Fdiv>\n<div class=\"rvg\" style=\"position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:28px\">\n<article class=\"card card-ivory rv\" style=\"background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:28px\">\n<div style=\"width:54px;height:54px;border-radius:50%;background:var(--coral);color:var(--tealDark);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900\">1<\u002Fdiv>\n<p style=\"font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--coralDeep);margin-top:22px\">STEP 1<\u002Fp>\n<h3 style=\"font-size:21px;font-weight:700;margin-top:6px\">공정 문제 파악<\u002Fh3>\n<p style=\"font-size:16px;line-height:1.75;color:var(--muted);margin-top:10px\">반복 작업, 불량 발생, 품질검사 등 개선이 필요한 부분을 정리합니다.<\u002Fp>\n<svg class=\"flow-arrow arr\" sc-camel-view-box=\"0 0 28 28\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"14\" cy=\"14\" r=\"14\" fill=\"#D98C78\"><\u002Fcircle><path d=\"M9 14h10M15 10l4 4-4 4\" stroke=\"#1B343E\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n<\u002Farticle>\n<article class=\"card card-ivory rv\" style=\"background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:28px\">\n<div style=\"width:54px;height:54px;border-radius:50%;background:var(--coral);color:var(--tealDark);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900\">2<\u002Fdiv>\n<p style=\"font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--coralDeep);margin-top:22px\">STEP 2<\u002Fp>\n<h3 style=\"font-size:21px;font-weight:700;margin-top:6px\">데이터 확인<\u002Fh3>\n<p style=\"font-size:16px;line-height:1.75;color:var(--muted);margin-top:10px\">제품 이미지, 센서 데이터, 생산 기록 등 활용 가능한 정보를 확인합니다.<\u002Fp>\n<svg class=\"flow-arrow arr\" sc-camel-view-box=\"0 0 28 28\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"14\" cy=\"14\" r=\"14\" fill=\"#D98C78\"><\u002Fcircle><path d=\"M9 14h10M15 10l4 4-4 4\" stroke=\"#1B343E\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n<\u002Farticle>\n<article class=\"card card-ivory rv\" style=\"background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:28px\">\n<div style=\"width:54px;height:54px;border-radius:50%;background:var(--coral);color:var(--tealDark);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900\">3<\u002Fdiv>\n<p style=\"font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--coralDeep);margin-top:22px\">STEP 3<\u002Fp>\n<h3 style=\"font-size:21px;font-weight:700;margin-top:6px\">분석 방법 비교<\u002Fh3>\n<p style=\"font-size:16px;line-height:1.75;color:var(--muted);margin-top:10px\">AI 결함 탐지, 불량 예측, 시뮬레이션 등 문제에 적합한 방법을 비교합니다.<\u002Fp>\n<svg class=\"flow-arrow arr\" sc-camel-view-box=\"0 0 28 28\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"14\" cy=\"14\" r=\"14\" fill=\"#D98C78\"><\u002Fcircle><path d=\"M9 14h10M15 10l4 4-4 4\" stroke=\"#1B343E\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n<\u002Farticle>\n<article class=\"card card-ivory rv\" style=\"background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:28px\">\n<div style=\"width:54px;height:54px;border-radius:50%;background:var(--coral);color:var(--tealDark);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900\">4<\u002Fdiv>\n<p style=\"font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--coralDeep);margin-top:22px\">STEP 4<\u002Fp>\n<h3 style=\"font-size:21px;font-weight:700;margin-top:6px\">현장 적용 조건 검토<\u002Fh3>\n<p style=\"font-size:16px;line-height:1.75;color:var(--muted);margin-top:10px\">분석 결과와 기존 설비, 운영 인력, 검증 방법 및 비용 등을 함께 고려합니다.<\u002Fp>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"rv\" style=\"margin-top:36px;font-size:15px;line-height:1.7;color:var(--muted)\">연구 프로젝트를 바탕으로 정리한 검토 단계이며, 상용 서비스로 실제 공장에 적용된 사례를 뜻하지 않습니다.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- 05 PROOF -->\n<section id=\"proof\" class=\"sec\" style=\"background:var(--teal);color:var(--ivory)\">\n<div class=\"wrap\">\n<div class=\"rv\" style=\"max-width:820px\">\n<p style=\"font-size:14px;font-weight:700;letter-spacing:.12em;color:rgba(245,241,232,.8);margin-bottom:16px\">05 · PROOF<\u002Fp>\n<h2 class=\"h2\">실제 연구 프로젝트에서 확인한 AI·데이터 분석의 가능성<\u002Fh2>\n<p class=\"lead\" style=\"margin-top:20px;color:rgba(245,241,232,.9)\">각 수치는 서로 다른 검증 지표입니다. 연구 환경에서 확인한 결과이며, 현장 적용 성과를 보장하지 않습니다.<\u002Fp>\n<\u002Fdiv>\n<div class=\"rvg\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:28px;margin-top:56px;align-items:stretch\">\n\n<!-- CASE 01 -->\n<article class=\"card rv proofcard\" style=\"background:var(--ivory);color:var(--teal);border-radius:20px;overflow:hidden;display:flex;flex-direction:column\">\n<div class=\"pv\" style=\"aspect-ratio:16/10;background:#E9E3D3;border-bottom:1px dashed #A9A08A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px;text-align:center\">\n<p style=\"font-size:15px;font-weight:700\">[교체 가능한 이미지 영역]<\u002Fp>\n<p style=\"font-size:14px;color:var(--muted);line-height:1.6\">비누 제품 이미지 · AI 결함 탐지 이미지 · 검증 결과 그래프<br>실제 연구 화면을 넣어 주세요<\u002Fp>\n<\u002Fdiv>\n<div class=\"stg\" style=\"padding:28px;display:flex;flex-direction:column;flex:1\">\n<p style=\"font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--coralDeep)\">CASE 01<\u002Fp>\n<h3 style=\"font-size:22px;font-weight:700;line-height:1.4;margin-top:8px\">비누 제조공정 AI 품질검사<\u002Fh3>\n<p style=\"font-size:15px;font-weight:500;color:var(--muted);margin-top:6px\">딥러닝 기반 비누 제조공정 0%;background:var(--teal);display:block\"><\u002Fspan>\n<span style=\"width:26px;height:26px;border-radius:50%;background:var(--teal);display:block\"><\u002Fspan>\n<span style=\"width:26px;height:26px;border-radius:50%;background:var(--teal);display:block\"><\u002Fspan>\n<span style=\"width:22px;height:22px;border-radius:50%;border:2px dashed var(--teal);display:block\"><\u002Fspan>\n<\u002Fdiv>\n<p style=\"font-size:14px;color:var(--muted)\">채움 7건 탐지 · 점선 1건 미탐지<\u002Fp>\n<\u002Fdiv>\n<div class=\"stg\" style=\"padding:28px;display:flex;flex-direction:column;flex:1\">\n<p style=\"font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--coralDeep)\">CASE 02<\u002Fp>\n<h3 style=\"font-size:22px;font-weight:700;line-height:1.4;margin-top:8px\">AI 용접 품질 예측<\u002Fh3>\n<p style=\"font-size:15px;font-weight:500;color:var(--muted);margin-top:6px\">중소 제조기업에 필요한 AI 용접 품질 예측 파이프라인<\u002Fp>\n<p style=\"font-size:16px;line-height:1.75;margin-top:14px\">용접 전류, 전압, 가압력, 통전시간 등의 센서 데이터를 분석해 이상 징후 탐지와 불량 예측 모델을 비교했습니다.<\u002Fp>\n<div style=\"margin-top:22px;padding-top:20px;border-top:1px solid var(--line)\">\n<p style=\"font-size:14px;font-weight:700;color:var(--muted)\">교차검증 F1-Score<\u002Fp>\n<p style=\"font-size:54px;line-height:1.1;font-weight:900;letter-spacing:-0.03em;margin-top:6px\">0.824<\u002Fp>\n<p style=\"font-size:15px;margin-top:6px\">평가 데이터에서 실제 이상 8건 중 7건을 탐지했습니다.<\u002Fp>\n<\u002Fdiv>\n<div style=\"margin-top:20px;background:#E9E3D3;border-radius:12px;padding:16px 18px\">\n<p style=\"font-size:14px;font-weight:700\">적용 범위와 한계<\u002Fp>\n<p style=\"font-size:14px;line-height:1.7;color:var(--muted);margin-top:4px\">불량 정답 데이터가 제한적이므로 실제 현장에 대한 일반화 성능은 추가 검증이 필요합니다.<\u002Fp>\n<\u002Fdiv>\n<p style=\"font-size:13px;color:var(--muted);margin-top:auto;padding-top:18px\">출처: [연구 보고서명 · 기관 · 연도 입력]<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<!-- CASE 03 -->\n<article class=\"card rv proofcard\" style=\"background:var(--ivory);color:var(--teal);border-radius:20px;overflow:hidden;display:flex;flex-direction:column\">\n<div class=\"pv\" style=\"aspect-ratio:16/10;background:#E9E3D3;border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px 28px\">\n<p style=\"font-size:14px;font-weight:700\">평균 고객 이탈 팀 수 (시뮬레이션)<\u002Fp>\n<div style=\"display:flex;align-items:center;gap:12px\">\n<span style=\"width:64px;font-size:13px;color:var(--muted)\">기존<\u002Fspan>\n<span style=\"flex:1;display:block\"><span style=\"display:block;height:26px;width:100%;border-radius:6px;background:#8CA0A6\"><\u002Fspan><\u002Fspan>\n<span style=\"width:48px;text-align:right;font-size:15px;font-weight:700\">2.3팀<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:12px\">\n<span style=\"width:64px;font-size:13px;color:var(--muted)\">개선안<\u002Fspan>\n<span style=\"flex:1;display:block\"><span style=\"display:block;height:26px;width:28.3%;border-radius:6px;background:var(--teal)\"><\u002Fspan><\u002Fspan>\n<span style=\"width:48px;text-align:right;font-size:15px;font-weight:700\">0.65팀<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"stg\" style=\"padding:28px;display:flex;flex-direction:column;flex:1\">\n<p style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px\"><span style=\"font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--coralDeep)\">CASE 03<\u002Fspan><span style=\"font-size:13px;font-weight:700;color:var(--coralDeep);border:1px solid var(--coralDeep);border-radius:999px;padding:2px 10px\">제조업 외 별도 업종 연구<\u002Fspan><\u002Fp>\n<h3 style=\"font-size:22px;font-weight:700;line-height:1.4;margin-top:8px\">데이터 기반 운영 최적화<\u002Fh3>\n<p style=\"font-size:15px;font-weight:500;color:var(--muted);margin-top:6px\">레스토랑 좌석 운영 시뮬레이션 최적화<\u002Fp>\n<p style=\"font-size:16px;line-height:1.75;margin-top:14px\">실제 레스토랑 운영 데이터를 활용해 좌석 운영 시나리오를 비교했습니다. 시뮬레이션에서 평균 고객 이탈 팀 수가 기존 2.3팀에서 개선안 0.65팀으로 감소했습니다.<\u002Fp>\n<div style=\"margin-top:22px;padding-top:20px;border-top:1px s gin-bottom:16px\">04 · HOW IT WORKS<\u002Fp>\n<h2 class=\"h2\">AI와 데이터로 공정 개선 가능성을 검토합니다.<\u002Fh2>\n<\u002Fdiv>\n<div class=\"rvl\" style=\"position:relative;margin-top:56px\">\n<div class=\"fill-line\"><\u002Fdiv>\n<div class=\"rvg\" style=\"position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:28px\">\n<article class=\"card card-ivory rv\" style=\"background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:28px\">\n<div style=\"width:54px;height:54px;border-radius:50%;background:var(--coral);color:var(--tealDark);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900\">1<\u002Fdiv>\n<p style=\"font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--coralDeep);margin-top:22px\">STEP 1<\u002Fp>\n<h3 style=\"font-size:21px;font-weight:700;margin-top:6px\">공정 문제 파악<\u002Fh3>\n<p style=\"font-size:16px;line-height:1.75;color:var(--muted);margin-top:10px\">반복 작업, 불량 발생, 품질검사 등 개선이 필요한 부분을 정리합니다.<\u002Fp>\n<svg class=\"flow-arrow arr\" viewBox=\"0 0 28 28\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"14\" cy=\"14\" r=\"14\" fill=\"#D98C78\"><\u002Fcircle><path d=\"M9 14h10M15 10l4 4-4 4\" stroke=\"#1B343E\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n<\u002Farticle>\n<article class=\"card card-ivory rv\" style=\"background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:28px\">\n<div style=\"width:54px;height:54px;border-radius:50%;background:var(--coral);color:var(--tealDark);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900\">2<\u002Fdiv>\n<p style=\"font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--coralDeep);margin-top:22px\">STEP 2<\u002Fp>\n<h3 style=\"font-size:21px;font-weight:700;margin-top:6px\">데이터 확인<\u002Fh3>\n<p style=\"font-size:16px;line-height:1.75;color:var(--muted);margin-top:10px\">제품 이미지, 센서 데이터, 생산 기록 등 활용 가능한 정보를 확인합니다.<\u002Fp>\n<svg class=\"flow-arrow arr\" viewBox=\"0 0 28 28\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"14\" cy=\"14\" r=\"14\" fill=\"#D98C78\"><\u002Fcircle><path d=\"M9 14h10M15 10l4 4-4 4\" stroke=\"#1B343E\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n<\u002Farticle>\n<article class=\"card card-ivory rv\" style=\"background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:28px\">\n<div style=\"width:54px;height:54px;border-radius:50%;background:var(--coral);color:var(--tealDark);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900\">3<\u002Fdiv>\n<p style=\"font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--coralDeep);margin-top:22px\">STEP 3<\u002Fp>\n<h3 style=\"font-size:21px;font-weight:700;margin-top:6px\">분석 방법 비교<\u002Fh3>\n<p style=\"font-size:16px;line-height:1.75;color:var(--muted);margin-top:10px\">AI 결함 탐지, 불량 예측, 시뮬레이션 등 문제에 적합한 방법을 비교합니다.<\u002Fp>\n<svg class=\"flow-arrow arr\" viewBox=\"0 0 28 28\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"14\" cy=\"14\" r=\"14\" fill=\"#D98C78\"><\u002Fcircle><path d=\"M9 14h10M15 10l4 4-4 4\" stroke=\"#1B343E\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n<\u002Farticle>\n<article class=\"card card-ivory rv\" style=\"background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:28px\">\n<div style=\"width:54px;height:54px;border-radius:50%;background:var(--coral);color:var(--tealDark);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900\">4<\u002Fdiv>\n<p style=\"font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--coralDeep);margin-top:22px\">STEP 4<\u002Fp>\n<h3 style=\"font-size:21px;font-weight:700;margin-top:6px\">현장 적용 조건 검토<\u002Fh3>\n<p style=\"font-size:16px;line-height:1.75;color:var(--muted);margin-top:10px\">분석 결과와 기존 설비, 운영 인력, 검증 방법 및 비용 등을 함께 고려합니다.<\u002Fp>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"rv\" style=\"margin-top:36px;font-size:15px;line-height:1.7;color:var(--muted)\">연구 프로젝트를 바탕으로 정리한 검토 단계이며, 상용 서비스로 실제 공장에 적용된 사례를 뜻하지 않습니다.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"proof\" class=\"sec\" style=\"background:var(--teal);color:var(--ivory)\">\n<div class=\"wrap\">\n<div class=\"rv\" style=\"max-width:820px\">\n<p style=\"font-size:14px;font-weight:700;letter-spacing:.12em;color:rgba(245,241,232,.8);margin-bottom:16px\">05 · PROOF<\u002Fp>\n<h2 class=\"h2\">실제 연구 프로젝트에서 확인한 AI·데이터 분석의 가능성<\u002Fh2>\n<p class=\"lead\" style=\"margin-top:20px;color:rgba(245,241,232,.9)\">각 수치는 서로 다른 검증 지표입니다. 연구 환경에서 확인한 결과이며, 현장 적용 성과를 보장하지 않습니다.<\u002Fp>\n<\u002Fdiv>\n<div class=\"rvg\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:28px;margin-top:56px;align-items:stretch\">\n\n\n<article class=\"card rv proofcard\" style=\"background:var(--ivory);color:var(--teal);border-radius:20px;overflow:hidden;display:flex;flex-direction:column\">\n<div class=\"pv\" style=\"aspect-ratio:16/10;background:#E9E3D3;border-bottom:1px dashed #A9A08A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px;text-align:center\">\n<p style=\"font-size:15px;font-weight:700\">[교체 가능한 이미지 영역]<\u002Fp>\n<p style=\"font-size:14px;color:var(--muted);line-height:1.6\">비누 제품 이미지 · AI 결함 탐지 이미지 · 검증 결과 그래프<br>실제 연구 화면을 넣어 주세요<\u002Fp>\n<\u002Fdiv>\n<div class=\"stg\" style=\"padding:28px;display:flex;flex-direction:column;flex:1\">\n<p style=\"font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--coralDeep)\">CASE 01<\u002Fp>\n<h3 style=\"font-size:22px;font-weight:700;line-height:1.4;margin-top:8px\">비누 제조공정 AI 품질검사<\u002Fh3>\n<p style=\"font-size:15px;font-weight:500;color:var(--muted);margin-top:6px\">딥러닝 기반 비누 제조공정 결함 검출<\u002Fp>\n<p style=\"font-size:16px;line-height:1.75;margin-top:14px\">약 250장의 비누 이미지를 활용하여 크기, 색상, 외관 결함 등을 );display:block\"><\u002Fspan>\n<span style=\"width:26px;height:26px;border-radius:50%;background:var(--teal);display:block\"><\u002Fspan>\n<span style=\"width:22px;height:22px;border-radius:50%;border:2px dashed var(--teal);display:block\"><\u002Fspan>\n<\u002Fdiv>\n<p style=\"font-size:14px;color:var(--muted)\">채움 7건 탐지 · 점선 1건 미탐지<\u002Fp>\n<\u002Fdiv>\n<div class=\"stg\" style=\"padding:28px;display:flex;flex-direction:column;flex:1\">\n<p style=\"font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--coralDeep)\">CASE 02<\u002Fp>\n<h3 style=\"font-size:22px;font-weight:700;line-height:1.4;margin-top:8px\">AI 용접 품질 예측<\u002Fh3>\n<p style=\"font-size:15px;font-weight:500;color:var(--muted);margin-top:6px\">중소 제조기업에 필요한 AI 용접 품질 예측 파이프라인<\u002Fp>\n<p style=\"font-size:16px;line-height:1.75;margin-top:14px\">용접 전류, 전압, 가압력, 통전시간 등의 센서 데이터를 분석해 이상 징후 탐지와 불량 예측 모델을 비교했습니다.<\u002Fp>\n<div style=\"margin-top:22px;padding-top:20px;border-top:1px solid var(--line)\">\n<p style=\"font-size:14px;font-weight:700;color:var(--muted)\">교차검증 F1-Score<\u002Fp>\n<p style=\"font-size:54px;line-height:1.1;font-weight:900;letter-spacing:-0.03em;margin-top:6px\">0.824<\u002Fp>\n<p style=\"font-size:15px;margin-top:6px\">평가 데이터에서 실제 이상 8건 중 7건을 탐지했습니다.<\u002Fp>\n<\u002Fdiv>\n<div style=\"margin-top:20px;background:#E9E3D3;border-radius:12px;padding:16px 18px\">\n<p style=\"font-size:14px;font-weight:700\">적용 범위와 한계<\u002Fp>\n<p style=\"font-size:14px;line-height:1.7;color:var(--muted);margin-top:4px\">불량 정답 데이터가 제한적이므로 실제 현장에 대한 일반화 성능은 추가 검증이 필요합니다.<\u002Fp>\n<\u002Fdiv>\n<p style=\"font-size:13px;color:var(--muted);margin-top:auto;padding-top:18px\">출처: [연구 보고서명 · 기관 · 연도 입력]<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n\n<article class=\"card rv proofcard\" style=\"background:var(--ivory);color:var(--teal);border-radius:20px;overflow:hidden;display:flex;flex-direction:column\">\n<div class=\"pv\" style=\"aspect-ratio:16/10;background:#E9E3D3;border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px 28px\">\n<p style=\"font-size:14px;font-weight:700\">평균 고객 이탈 팀 수 (시뮬레이션)<\u002Fp>\n<div style=\"display:flex;align-items:center;gap:12px\">\n<span style=\"width:64px;font-size:13px;color:var(--muted)\">기존<\u002Fspan>\n<span style=\"flex:1;display:block\"><span style=\"display:block;height:26px;width:100%;border-radius:6px;background:#8CA0A6\"><\u002Fspan><\u002Fspan>\n<span style=\"width:48px;text-align:right;font-size:15px;font-weight:700\">2.3팀<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:12px\">\n<span style=\"width:64px;font-size:13px;color:var(--muted)\">개선안<\u002Fspan>\n<span style=\"flex:1;display:block\"><span style=\"display:block;height:26px;width:28.3%;border-radius:6px;background:var(--teal)\"><\u002Fspan><\u002Fspan>\n<span style=\"width:48px;text-align:right;font-size:15px;font-weight:700\">0.65팀<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"stg\" style=\"padding:28px;display:flex;flex-direction:column;flex:1\">\n<p style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px\"><span style=\"font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--coralDeep)\">CASE 03<\u002Fspan><span style=\"font-size:13px;font-weight:700;color:var(--coralDeep);border:1px solid var(--coralDeep);border-radius:999px;padding:2px 10px\">제조업 외 별도 업종 연구<\u002Fspan><\u002Fp>\n<h3 style=\"font-size:22px;font-weight:700;line-height:1.4;margin-top:8px\">데이터 기반 운영 최적화<\u002Fh3>\n<p style=\"font-size:15px;font-weight:500;color:var(--muted);margin-top:6px\">레스토랑 좌석 운영 시뮬레이션 최적화<\u002Fp>\n<p style=\"font-size:16px;line-height:1.75;margin-top:14px\">실제 레스토랑 운영 데이터를 활용해 좌석 운영 시나리오를 비교했습니다. 시뮬레이션에서 평균 고객 이탈 팀 수가 기존 2.3팀에서 개선안 0.65팀으로 감소했습니다.<\u002Fp>\n<div style=\"margin-top:22px;padding-top:20px;border-top:1px solid var(--line)\">\n<p style=\"font-size:14px;font-weight:700;color:var(--muted)\">시뮬레이션상 이탈 감소<\u002Fp>\n<p style=\"font-size:54px;line-height:1.1;font-weight:900;letter-spacing:-0.03em;margin-top:6px\">약 71.7<span style=\"font-size:32px\">%<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n<div style=\"margin-top:20px;background:#E9E3D3;border-radius:12px;padding:16px 18px\">\n<p style=\"font-size:14px;font-weight:700\">적용 범위와 한계<\u002Fp>\n<p style=\"font-size:14px;line-height:1.7;color:var(--muted);margin-top:4px\">제조업이 아닌 별도 업종의 연구이며, 제조공정 자동화 실적이 아닙니다. 데이터 기반 의사결정 방식의 사례로만 참고해 주세요.<\u002Fp>\n<\u002Fdiv>\n<p style=\"font-size:13px;color:var(--muted);margin-top:auto;padding-top:18px\">출처: [연구 보고서명 · 기관 · 연도 입력]<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"criteria\" class=\"sec\" style=\"background:var(--ivory)\">\n<div class=\"wrap\">\n<div class=\"rv\" style=\"max-width:760px\">\n<p style=\"font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--coralDeep);margin-bottom:16px\">06 · FAQ &amp; CHECKLIST<\u002Fp>\n<h2 class=\"h2\">우리 공장에도 적용할 수 있을까요?<\u002Fh2>\n<p class=\"lead\" style=\"margin-top:20px;color:var(--muted)\">AI 도입은 모든 제조현장에 같은 방식으로 적용되지 않습니다. 먼저 우리 공장의 조건을 확인해 보세요.<\u002Fp>\n<\u002Fdiv>\n\n<h3 class=\"rv\" style=\"font-size:22px;font-weight:700;margin-top:56px\">도입 전 확인할 4가지<\u002Fh3>\n<ul class=\"rvg\" style=\"list-style:none;margin:24px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:20px\">\n<li class=\"card card-ivory rv\" style=\"display:flex;gap:18px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px\">\n<span style=\"flex:none;width:36px;height:36px;border-radius:10px;background:var(--teal);color:var(--coral);display:flex;align-items:center;justify-content:center\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<div><p style= ;border:1px solid var(--line);border-radius:16px;padding:24px\">\n<span style=\"flex:none;width:36px;height:36px;border-radius:10px;background:var(--teal);color:var(--coral);display:flex;align-items:center;justify-content:center\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<div><p style=\"font-size:13px;font-weight:700;color:var(--coralDeep);letter-spacing:.1em\">CHECK 04<\u002Fp><p style=\"font-size:18px;font-weight:700;line-height:1.5;margin-top:4px\">기존 설비와 운영 환경에 적용할 수 있나요?<\u002Fp><\u002Fdiv>\n<\u002Fli>\n<\u002Ful>\n\n<h3 class=\"rv\" style=\"font-size:22px;font-weight:700;margin-top:72px\">자주 묻는 질문<\u002Fh3>\n<div class=\"rv\" style=\"margin-top:24px;border-top:1px solid var(--line);max-width:900px\">\n\n<div style=\"border-bottom:1px solid var(--line)\">\n<h4 style=\"margin:0\"><button type=\"button\" style=\"all:unset;box-sizing:border-box;width:100%;min-height:64px;padding:20px 4px;display:flex;align-items:center;justify-content:space-between;gap:20px;cursor:pointer;font-size:18px;font-weight:700;line-height:1.5;font-family:inherit;color:var(--teal)\">기존 설비를 모두 교체해야 하나요?<svg class=\"faq-chev\" style=\"flex:none;transform:rotate(deg)\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fh4>\n<div class=\"faq-body\" style=\"display:grid;grid-template-rows:\"><div style=\"overflow:hidden;min-height:0\"><p style=\"padding:0 4px 24px;font-size:16px;line-height:1.8;color:var(--muted)\">현재 설비와 데이터 수집 환경에 따라 다릅니다. 기존 설비를 활용할 수 있는지 먼저 확인할 필요가 있습니다.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"border-bottom:1px solid var(--line)\">\n<h4 style=\"margin:0\"><button type=\"button\" style=\"all:unset;box-sizing:border-box;width:100%;min-height:64px;padding:20px 4px;display:flex;align-items:center;justify-content:space-between;gap:20px;cursor:pointer;font-size:18px;font-weight:700;line-height:1.5;font-family:inherit;color:var(--teal)\">AI가 모든 불량을 정확하게 예측하나요?<svg class=\"faq-chev\" style=\"flex:none;transform:rotate(deg)\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fh4>\n<div class=\"faq-body\" style=\"display:grid;grid-template-rows:\"><div style=\"overflow:hidden;min-height:0\"><p style=\"padding:0 4px 24px;font-size:16px;line-height:1.8;color:var(--muted)\">그렇지 않습니다. 모델 성능은 데이터와 제조환경에 따라 달라집니다. 실제 적용 전 별도의 검증이 필요합니다.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"border-bottom:1px solid var(--line)\">\n<h4 style=\"margin:0\"><button type=\"button\" style=\"all:unset;box-sizing:border-box;width:100%;min-height:64px;padding:20px 4px;display:flex;align-items:center;justify-content:space-between;gap:20px;cursor:pointer;font-size:18px;font-weight:700;line-height:1.5;font-family:inherit;color:var(--teal)\">AI 전문 인력이 없어도 가능한가요?<svg class=\"faq-chev\" style=\"flex:none;transform:rotate(deg)\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fh4>\n<div class=\"faq-body\" style=\"display:grid;grid-template-rows:\"><div style=\"overflow:hidden;min-height:0\"><p style=\"padding:0 4px 24px;font-size:16px;line-height:1.8;color:var(--muted)\">용접 품질 예측 프로젝트에서는 일반 노트북 환경에서 작동하는 GUI와 사용자 안내 기능을 연구했습니다. 다만 실제 현장 운영 가능성은 별도로 검토해야 합니다.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"border-bottom:1px solid var(--line)\">\n<h4 style=\"margin:0\"><button type=\"button\" style=\"all:unset;box-sizing:border-box;width:100%;min-height:64px;padding:20px 4px;display:flex;align-items:center;justify-content:space-between;gap:20px;cursor:pointer;font-size:18px;font-weight:700;line-height:1.5;font-family:inherit;color:var(--teal)\">도입하면 비용이 얼마나 절감되나요?<svg class=\"faq-chev\" style=\"flex:none;transform:rotate(deg)\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fh4>\n<div class=\"faq-body\" style=\"display:grid;grid-template-rows:\"><div style=\"overflow:hidden;min-height:0\"><p style=\"padding:0 4px 24px;font-size:16px;line-height:1.8;color:var(--muted)\">현재 공정의 실제 작업 조건과 비용 자료가 없으므로 절감액을 단정할 수 없습니다. 도입 전 비용 대비 기대효과를 검토해야 합니다.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n<div class=\"rv\" style=\"margin-top:56px;display:flex;flex-wrap:wrap;align-items:center;gap:20px\">\n<a href=\"#contact\" class=\"btn btn-teal\">우리 공정 상황 전달하기\n<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"contact\" class=\"sec\" style=\"background:var(--teal);color:var(--ivory)\">\n<div class=\"wrap\">\n<div class=\"rv\" style=\"max-width:820px\">\n<p style=\"font-size:14px;font-weight:700;letter-spacing:.12em;color:rgba(245,241,232,.8);margin-bottom:16px\">07 · CONVERSION<\u002Fp>\n<h2 class=\"h2\">우리 공장의 개선 가능성, 현재 상황부터 알려주세요.<\u002Fh2>\n<div class=\"lead\" style=\"margin-top:24px;color:rgba(245,241,232,.92);display:flex;flex-direction:column;gap:6px\">\n<p>어떤 제조공정을 운영하고 계신가요?<\u002Fp>\n<p>어떤 문제가 반복되고 있나요?<\u002Fp>\n<p>가장 원하는 개선 결과는 무엇인가요?<\u002Fp>\n<p style=\"margin-top:14px\">현재 공정의 상황을 전달하고 필요한 검토 사항을 확인하는 첫 단계를 시작해 보세요.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<ol class=\"rvg\" style=\"list-style:none;margin:48px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:20px;max-width:900px\">\n<li class=\"rv\" style=\"display:flex;gap:16px;align-items:center;background:rgba(245,241,232,.08);border:1px solid rgba(245,241,232,.2);border-radius:16px;padding:20px\">\n<span style=\"flex:none;width:40px;height:40px;border-radius:50%;background:var(--coral);color:var(--tealDark);display:flex;align-items:center;justify-content:center;font-weight:900\">1<\u002Fspan>\n<span style=\"font-size:16px;line-height:1.5;font-weight:500\">현재 제조공정 정보 입력<\u002Fspan><\u002Fli>\n<li class=\"rv\" style=\"display:flex;gap:16px;align-items:center;background:rgba(245,241,232,.08);border:1px solid rgba(245,241,232,.2);border-radius:16px;padding:20px\">\n<span style=\"flex:none;width:40px;height:40px;border-radius:50%;background:var(--coral);color:var(--tealDark);display:flex;align-items:center;justify-content:center;font-weight:900\">2<\u002Fspan>\n<span style=\"font-size:16px;line-height:1.5;font-weight:500\">가장 큰 고민과 개선 목표 전달<\u002Fspan><\u002Fli>\n<li class=\"rv\" style=\"display:flex;gap:16px;align-items:center;background:rgba(245,241,232,.08);border:1px solid rgba(245,241,232,.2);border-radius:16px;padding:20px\">\n<span style=\"flex:none;width:40px;height:40px;border-radius:50%;background:var(--coral);color:var(--tealDark);display:flex;align-items:center;justify-content:center;font-weight:900\">3<\u002Fspan>\n<span style=\"font-size:16px;line-height:1.5;font-weight:500\">검토 요청 제출<\u002Fspan><\u002Fli>\n<\u002Fol>\n\n<div class=\"rv\" style=\"margin-top:48px;display:flex;flex-direction:column;align-items:flex-start;gap:20px\">\n<a rel=\"noopener\" class=\"btn btn-coral\">공정 개선 검토 요청하기\n<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n\n<p id=\"form-notice\" role=\"status\" style=\"font-size:15px;line-height:1.7;max-width:640px;border:1px dashed rgba(245,241,232,.55);border-radius:12px;padding:14px 18px;color:rgba(245,241,232,.95)\"><strong>설정 필요:<\u002Fstrong> 아직 Google Form 주소가 연결되지 않았습니다. 이 버튼은 주소(GOOGLE_FORM_URL)를 입력하면 새 탭에서 폼으로 이동합니다. 입력 방법: 이 아티팩트의 Tweaks 탭에서 「formUrl」에 폼 주소를 붙여 넣으세요.<\u002Fp>\n\n<\u002Fdiv>\n\n<p class=\"rv\" style=\"margin-top:56px;max-width:820px;font-size:14px;line-height:1.8;color:rgba(245,241,232,.82);border-top:1px solid rgba(245,241,232,.2);padding-top:24px\">본 페이지는 연구 프로젝트 기반의 기술 소개 및 도입 검토 콘텐츠입니다. 실제 상담 가능 여부, 상용 서비스 범위 및 비용은 추가 확인이 필요합니다.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background:var(--tealDark);color:rgba(245,241,232,.8);padding:28px 0\">\n<div class=\"wrap\" style=\"display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between;font-size:14px\">\n<span>[브랜드명 미정] · 중소 제조기업 AI·데이터 공정 개선 검토<\u002Fspan>\n<span>[연락처 · 사업자 정보 입력]<\u002Fspan>\n<\u002Fdiv>\n<\u002Ffooter>\n\n\n<div class=\"mbar\">\n<a rel=\"noopener\" class=\"btn btn-coral\">공정 개선 검토 요청하기\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;formUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;section&quot;:&quot;연결&quot;},&quot;teal&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#264653&quot;,&quot;section&quot;:&quot;색상&quot;},&quot;ivory&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#F5F1E8&quot;,&quot;section&quot;:&quot;색상&quot;},&quot;coral&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#D98C78&quot;,&quot;section&quot;:&quot;색상&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:6200}}\">\nclass Component extends DCLogic {\ncomponentDidMount() { this._boot(); }\ncomponentDidUpdate() {\n  const r = this._root();\n  if (r && !r.classList.contains('js-on')) r.classList.add('js-on');\n}\ncomponentWillUnmount() {\n  if (this._io) this._io.disconnect();\n  if (this._io2) this._io2.disconnect();\n}\n_root() { return this._rootEl || document.querySelector('.lp'); }\n_boot() {\n  const root = this._root();\n  if (!root) return;\n  root.classList.add('js-on');\n  const els = [].slice.call(root.querySelectorAll('.rv, .rvl'));\n  if (!('IntersectionObserver' in window)) {\n    els.forEach((e) => e.classList.add('in'));\n    return;\n  }\n  // 스크롤 등장: 화면에 들어오면 .in 을 붙여 CSS 애니메이션 실행 (한 번만)\n  this._io = new IntersectionObserver((entries) => {\n    entries.forEach((en) => {\n      if (en.isIntersecting) {\n        en.target.classList.add('in');\n        this._io.unobserve(en.target);\n      }\n    });\n  }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });\n  els.forEach((e) => this._io.observe(e));\n  // 모바일 하단 고정 CTA: 히어로를 지나면 나타나고, 최종 CTA 영역에서는 숨김\n  const bar = root.querySelector('.mbar');\n  const hero = root.querySelector('#top');\n  const contact = root.querySelector('#contact');\n  if (bar && hero) {\n    let heroPast = false, contactIn = false;\n    this._io2 = new IntersectionObserver((entries) => {\n      entries.forEach((en) => {\n        if (en.target === hero) heroPast = !en.isIntersecting && en.boundingClientRect.top < 0;\n        else contactIn = en.isIntersecting;\n      });\n      bar.classList.toggle('show', heroPast && !contactIn);\n    }, { threshold: 0 });\n    this._io2.observe(hero);\n    if (contact) this._io2.observe(contact);\n  }\n}\nrenderVals() {\n  if (!this._setRoot) this._setRoot = (el) => { if (el) this._rootEl = el; };\n  const url = (this.props.formUrl || '').trim();\n  const cur = (this.state && this.state.open !== undefined) ? this.state.open : 0;\n  const out = {\n    rootRef: this._setRoot,\n    teal: this.props.teal ?? '#264653',\n    ivory: this.props.ivory ?? '#F5F1E8',\n    coral: this.props.coral ?? '#D98C78',\n    needsUrl: !url,\n    formHref: url || '#form-notice',\n    formTarget: url ? '_blank' : '_self'\n  };\n  for (let i = 0; i < 4; i++) {\n    const isOpen = cur === i;\n    out['open' + i] = isOpen ? 'true' : 'false';\n    out['rows' + i] = isOpen ? '1fr' : '0fr';\n    out['rot' + i] = isOpen ? 180 : 0;\n    out['toggle' + i] = () => this.setState({ open: cur === i ? -1 : i });\n  }\n  return out;\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
